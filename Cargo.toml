[workspace]
resolver = "3"
members = [
    "crates/victus-core",
    "crates/victus-hw",
    "crates/victus-hubd",
    "crates/victus-hub",
]

[workspace.package]
version = "1.0.3"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
log = "0.4"
nix = { version = "0.29", features = ["socket", "user", "fs", "signal"] }
gtk4 = { version = "0.10", features = ["v4_14"] }
libadwaita = { version = "0.8", features = ["v1_5"] }
libloading = "0.8"
